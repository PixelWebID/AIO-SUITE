user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream content_intel {
        server content-intel:8000;
    }

    upstream social_hub {
        server social-hub:8080;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; img-src * data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

        location /api/content/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://content_intel$request_uri;
        }

        location /publish {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://social_hub$request_uri;
        }

        location /health/social-hub {
            proxy_http_version 1.1;
            proxy_pass http://social_hub/health;
        }

        location /health/content-intel {
            proxy_http_version 1.1;
            proxy_pass http://content_intel/health;
        }

        location / {
            return 404;
        }
    }
}

